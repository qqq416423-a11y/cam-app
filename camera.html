<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>远程摄像头</title>
<style>
  body{margin:0;background:#111;color:#ddd;font-family:system-ui,sans-serif;padding:16px}
  video{width:100%;max-width:480px;border-radius:8px;background:#000}
  #v.mirror{transform:scaleX(-1)}
  #status{margin-top:12px;font-size:15px;line-height:1.6;white-space:pre-wrap}
  .card{background:#1c1c1e;border-radius:12px;padding:16px;margin-bottom:12px;max-width:520px}
  .tip{color:#888;font-size:13px;line-height:1.6}
  h3{margin:4px 0 10px}
  #cd{font-size:44px;font-weight:bold;color:#4da3ff;min-height:56px}
</style>
</head>
<body>

<div id="setup" class="card" hidden>
  <h3>无法启动</h3>
  <p>链接里缺少 token 参数。请从 A 端页面复制「完整 B 端链接」（链接里自带 token），用它在手机浏览器打开即可，无需输入任何内容。</p>
  <p class="tip">首次打开时浏览器会弹一次摄像头权限，点一次「允许」后就会一直自动拍照上传，之后不再需要任何操作。</p>
</div>

<div id="app" hidden>
  <div class="card">
    <b>远程摄像头运行中（前置 · 连拍模式）</b>
    <p class="tip">打开即自动拍摄，每 <span id="cfg">-</span>。拍摄与上传全程自动，照片存入私有仓库供远程查看。想停止时关闭此页面即可。</p>
    <video id="v" autoplay playsinline muted></video>
    <div id="cd"></div>
    <div id="status">正在启动摄像头…</div>
  </div>
</div>

<script>
var OWNER='qqq416423-a11y';
var REPO='cam-photos';
var BRANCH='main';
var qs=new URLSearchParams(location.search);
var INTERVAL=Math.max(10,parseInt(qs.get('sec')||'30',10)||30); // 每轮间隔（秒）
var BURST=Math.max(1,parseInt(qs.get('n')||'5',10)||5);         // 每轮张数
var GAP=Math.max(50,parseInt(qs.get('gap')||'120',10)||120);    // 连拍间隔（毫秒）
var FACING=qs.get('front')==='0'?'environment':'user';          // 默认前置

var $=function(id){return document.getElementById(id)};
var token=null,video=null,worker=null,wakeLock=null,swReg=null,okCount=0,round=0,running=false;

$('cfg').textContent=INTERVAL+' 秒连拍 '+BURST+' 张，张间隔约 '+GAP+' 毫秒';

function setStatus(t){$('status').textContent=t}
function setCd(t){$('cd').textContent=t}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

// 链接自带 ?t=TOKEN 时自动保存，并立刻从地址栏清掉 token
var urlTok=qs.get('t');
if(urlTok){
  localStorage.setItem('cam_token',urlTok);
  try{history.replaceState(null,'',location.pathname)}catch(e){}
}

if(localStorage.getItem('cam_token')){
  boot();
}else{
  $('setup').hidden=false;
}

async function boot(){
  token=localStorage.getItem('cam_token');
  $('setup').hidden=true;$('app').hidden=false;
  // token 存入 IndexedDB，供 Service Worker 在后台（页面关闭后）上传使用
  idb().then(function(db){
    db.transaction('meta','readwrite').objectStore('meta').put(token,'token');
  }).catch(function(){});
  // 注册 Service Worker：拍完即使关掉页面，浏览器也会继续把队列传完
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      swReg=reg;
      if(reg.sync)reg.sync.register('cam-upload').catch(function(){});
    }).catch(function(){});
  }
  flushQueue();
  if(navigator.wakeLock){
    try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'&&navigator.wakeLock){
        navigator.wakeLock.request('screen').then(function(w){wakeLock=w}).catch(function(){});
      }
    });
  }
  startCamera();
}

async function startCamera(){
  try{
    var stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:FACING},width:{ideal:1280},height:{ideal:720}}
    });
    video=$('v');video.srcObject=stream;
    if(FACING==='user')video.className='mirror';
    try{await video.play()}catch(e){}
    // 等出帧并短暂稳定后，立刻拍第一轮（不等倒计时）
    while(!(video.readyState>=2&&video.videoWidth))await sleep(80);
    await sleep(500);
    burst();
    // 定时器放在 Web Worker 里，页面切后台也能按节奏触发下一轮
    worker=new Worker(URL.createObjectURL(new Blob(
      ['setInterval(function(){postMessage(1)},'+INTERVAL*1000+')'],
      {type:'text/javascript'}
    )));
    worker.onmessage=function(){countdownAndBurst()};
  }catch(e){
    setStatus('摄像头启动失败：'+e.name+'\n10 秒后自动重试…（若一直失败，请在浏览器设置里允许本站点使用摄像头）');
    setTimeout(startCamera,10000);
  }
}

function grabFrame(){
  var c=document.createElement('canvas');
  var w=video.videoWidth,h=video.videoHeight;
  var s=Math.min(1,720/w);
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  return c;
}

// 连拍一轮：先把帧全部抓完（快），再慢慢上传（弱网也不影响拍摄速度）
async function burst(){
  if(running||!video||video.readyState<2||!video.videoWidth)return;
  running=true;
  round++;
  setStatus('第 '+round+' 轮：正在连拍 '+BURST+' 张…');
  var frames=[];
  for(var i=0;i<BURST;i++){
    try{frames.push(grabFrame())}catch(e){}
    if(i<BURST-1)await sleep(GAP);
  }
  setCd('');
  setStatus('连拍完成，正在上传…');
  // 并行+错峰上传：比逐张串行快好几倍，同时错开提交避免冲突
  await Promise.all(frames.map(function(c,i){
    return sleep(i*600).then(function(){return uploadFrame(c,i+1)});
  }));
  running=false;
}

async function countdownAndBurst(){
  if(running)return;
  for(var t=3;t>0;t--){
    if(running)return;
    setCd(t);
    setStatus('下一轮倒计时，可以准备好姿势…');
    await sleep(1000);
  }
  setCd('');
  burst();
}

// ---------- 离线上传队列（IndexedDB）：照片先入队再传，关页面也不丢 ----------
function idb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('camq',1);
    r.onupgradeneeded=function(){
      var db=r.result;
      if(!db.objectStoreNames.contains('queue'))db.createObjectStore('queue',{keyPath:'name'});
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');
    };
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  });
}
function qPut(db,name,b64){
  return new Promise(function(res){
    var r=db.transaction('queue','readwrite').objectStore('queue').put({name:name,b64:b64});
    r.onsuccess=res;r.onerror=res;
  });
}
function qDel(db,name){
  return new Promise(function(res){
    var r=db.transaction('queue','readwrite').objectStore('queue').delete(name);
    r.onsuccess=res;r.onerror=res;
  });
}
function qAll(db){
  return new Promise(function(res){
    var r=db.transaction('queue','readonly').objectStore('queue').getAll();
    r.onsuccess=function(){res(r.result||[])};
    r.onerror=function(){res([])};
  });
}

async function uploadB64(b64,name){
  for(var t=0;t<3;t++){
    try{
      var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/photos/'+name,{
        method:'PUT',
        headers:{Authorization:'token '+token,'Content-Type':'application/json'},
        body:JSON.stringify({message:'auto photo',branch:BRANCH,content:b64})
      });
      if(r.ok||r.status===422){okCount++;return true}
    }catch(e){}
    await sleep(2000+t*1500);
  }
  return false;
}

// 每张照片：先入队（关页面也不丢）→ 页面内并行上传 → 失败则交给后台 sync 接管
async function uploadFrame(canvas,idx){
  var b64=canvas.toDataURL('image/jpeg',0.6).split(',')[1];
  var name='IMG_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2,6)+'.jpg';
  try{
    var db=await idb();
    await qPut(db,name,b64);
  }catch(e){}
  var ok=await uploadB64(b64,name);
  if(ok){
    try{var db2=await idb();await qDel(db2,name)}catch(e){}
    setStatus('已上传 '+okCount+' 张');
  }else{
    if(swReg&&swReg.sync)swReg.sync.register('cam-upload').catch(function(){});
    setStatus('网络太差，浏览器会在后台继续上传（关掉页面也能传完）');
  }
}

// 启动时补传上次没传完的照片
async function flushQueue(){
  try{
    var db=await idb();
    var list=await qAll(db);
    if(!list.length)return;
    setStatus('正在补传之前的照片…');
    await Promise.all(list.map(function(it){
      return uploadB64(it.b64,it.name).then(function(ok){
        if(ok)return qDel(db,it.name);
      }).catch(function(){});
    }));
  }catch(e){}
}
</script>
</body>
</html>
